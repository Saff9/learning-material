site_name: Learning Material
site_description: All notes and learning resources
site_author: Saff9
repo_url: https://github.com/Saff9/learning-material
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.tasklist

plugins:
  - search

nav:
  - Home: index.md
  - Mentorship Logs:
      - Overview: mentorship/index.md
  - Linux & Systems:
      - Overview: linux/index.md
  - PostgreSQL & Databases:
      - Overview: databases/index.md
  - C & Low Level:
      - Overview: c/index.md
  - Python & Flask:
      - Overview: python/index.md
  - Computer Science & OOP:
      - Overview: cs/index.md
